name: iOS / iPadOS

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Add LLVM tools
        # The Xcode 16.4 `nm` cannot parse the LLVM 23 object files that the
        # current stable Rust emits, and the macOS image's LLVM bottle is not in
        # the default prefix, so provide `llvm-nm` explicitly.
        run: brew install llvm

      - name: Make git fetches resilient
        # `kson-rodio-sources` pulls `Drewol/soundtouch-rs`, whose submodule
        # lives on codeberg.org. That host intermittently returns 503, so use
        # the git CLI (which retries and honours the settings below) and allow
        # retrying the submodule fetch instead of failing the whole build.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: Pre-fetch git dependencies
        # Fetching here keeps the (flaky) submodule clone in its own step, and
        # gives it a few attempts before the cargo build itself runs.
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            echo "cargo fetch failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          echo "cargo fetch failed after 3 attempts"
          exit 1

      - name: Build Rust static library
        # `embed-assets` bakes the default skin and fonts into the binary so the
        # app works without a separate resource copy; `--no-default-features`
        # keeps SoundTouch (desktop-only) out of the iOS build.
        #
        # `IPHONEOS_DEPLOYMENT_TARGET` must match `project.yml` so the C
        # dependencies (Lua, ring, ...) and the final link step agree on the
        # minimum OS version; otherwise `___chkstk_darwin` and friends are
        # referenced without a matching definition.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_NET_RETRY: "10"
        run: |
          # A `runtime` cdylib needs the app-side GL symbols, which do not
          # exist when the library is linked standalone. iOS only consumes the
          # staticlib, so restrict the emitted crate type here.
          cargo rustc --release \
            --target aarch64-apple-ios \
            -p rusc \
            --lib \
            --crate-type staticlib \
            --features embed-assets \
            --no-default-features \
            -- -C strip=debuginfo -C link-dead-code

          LIB="target/aarch64-apple-ios/release/librusc.a"
          test -f "$LIB" || { echo "missing $LIB"; exit 1; }
          # Xcode 16.4 ships an `nm` that cannot read the LLVM 23 object files
          # rustc emits, and the system `nm` cannot read the archive at all, so
          # use the LLVM `nm` installed earlier.
          NM="$(brew --prefix llvm)/bin/llvm-nm"
          for sym in _kson_ios_init _kson_ios_frame _kson_ios_resize _kson_ios_touch; do
            "$NM" "$LIB" | grep -q " T ${sym}$" || {
              echo "${sym} is not defined by ${LIB}"
              exit 1
            }
          done

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project KsonGame.xcodeproj \
            -scheme KsonGame \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KsonGame.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/KsonGame.xcarchive/Products/Applications/USC.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/USC-unsigned.ipa" Payload

      - name: Verify static library linked
        # The link itself proves the archive defines the entry points: if
        # `librusc.a` did not, `-u _kson_ios_init` (OTHER_LDFLAGS in
        # `project.yml`) would fail with "Undefined symbols". The stripped
        # Release binary no longer carries a symbol table entry, and `nm` on
        # this SDK cannot even read the archive, so check the two things that
        # are still observable: the installed archive defines them and the
        # final binary contains the entry-point names.
        run: |
          APP="$RUNNER_TEMP/KsonGame.xcarchive/Products/Applications/USC.app"
          test -f "$APP/USC" || { echo "missing executable"; exit 1; }
          LIB="target/aarch64-apple-ios/release/librusc.a"
          NM="$(brew --prefix llvm)/bin/llvm-nm"
          for sym in _kson_ios_init _kson_ios_frame _kson_ios_resize _kson_ios_touch; do
            "$NM" "$LIB" | grep -q " T ${sym}$" || {
              echo "${sym} is not defined by ${LIB}"
              exit 1
            }
          done
          # The Release binary is stripped, so a symbol-table search is not
          # meaningful. The link is the real proof: `-u _kson_ios_init`
          # (OTHER_LDFLAGS) makes ld fail with "Undefined symbols" if the
          # archive does not define the entry points, and `ARCHIVE SUCCEEDED`
          # above shows it did not. Report the binary size as a smoke check
          # that the ~100 MB staticlib really was pulled in.
          SIZE=$(stat -f%z "$APP/USC")
          echo "app binary size: ${SIZE} bytes"
          [ "$SIZE" -gt 5000000 ] || { echo "app binary is suspiciously small"; exit 1; }
          echo "the Rust staticlib is linked into the app binary"

      - uses: actions/upload-artifact@v4
        with:
          name: USC-ios-unsigned
          path: USC-unsigned.ipa
