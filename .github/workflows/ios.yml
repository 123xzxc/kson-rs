name: iOS / iPadOS

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ios-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ios-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Make git fetches resilient
        # `kson-rodio-sources` pulls `Drewol/soundtouch-rs`, whose submodule
        # lives on codeberg.org. That host intermittently returns 503, so use
        # the git CLI (which retries and honours the settings below) and allow
        # retrying the submodule fetch instead of failing the whole build.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: Pre-fetch git dependencies
        # Fetching here keeps the (flaky) submodule clone in its own step, and
        # gives it a few attempts before the cargo build itself runs.
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            echo "cargo fetch failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          echo "cargo fetch failed after 3 attempts"
          exit 1

      - name: Build Rust static library
        # `embed-assets` bakes the default skin and fonts into the binary so the
        # app works without a separate resource copy; `--no-default-features`
        # keeps SoundTouch (desktop-only) out of the iOS build.
        #
        # `IPHONEOS_DEPLOYMENT_TARGET` must match `project.yml` so the C
        # dependencies (Lua, ring, ...) and the final link step agree on the
        # minimum OS version; otherwise `___chkstk_darwin` and friends are
        # referenced without a matching definition.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CARGO_NET_RETRY: "10"
        run: |
          # A `runtime` cdylib needs the app-side GL symbols, which do not
          # exist when the library is linked standalone. iOS only consumes the
          # staticlib, so restrict the emitted crate type here.
          cargo rustc --release --verbose \
            --target aarch64-apple-ios \
            -p rusc \
            --lib \
            --crate-type staticlib \
            --features embed-assets \
            --no-default-features \
            -- -C strip=debuginfo

          LIB="target/aarch64-apple-ios/release/librusc.a"
          test -f "$LIB" || { echo "missing $LIB"; exit 1; }
          ls -la "$LIB"
          # Xcode 16.4 ships an `nm` that cannot read the LLVM 23 object files
          # rustc emits, so use the LLVM tools bundled with the toolchain.
          NM="$(dirname "$(rustc --print sysroot)")/../bin/llvm-nm"
          [ -x "$NM" ] || NM=llvm-nm
          "$NM" "$LIB" | grep -q "kson_ios_init" || {
            echo "librusc.a does not define the kson_ios_* entry points"
            "$NM" "$LIB" | grep -i 'ios' | head -n 20 || true
            exit 1
          }

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project KsonGame.xcodeproj \
            -scheme KsonGame \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KsonGame.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -skipPackagePluginValidation

      - name: Package .ipa
        run: |
          APP="$RUNNER_TEMP/KsonGame.xcarchive/Products/Applications/USC.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/USC-unsigned.ipa" Payload

      - name: Diagnose linked symbols
        run: |
          APP="$RUNNER_TEMP/KsonGame.xcarchive/Products/Applications/USC.app"
          ls -la "$APP"
          echo "--- structs referenced by the app binary ---"
          nm -u "$APP/USC" | sort -u | head -n 50
          echo "--- archive members defining the entry points ---"
          nm -A "$SRCROOT/../target/aarch64-apple-ios/release/librusc.a" 2>/dev/null | grep -i "kson_ios" || echo "(none found)"

      - name: Verify static library linked
        # `[profile.release] strip = true` in the root Cargo.toml strips local
        # symbols from the Rust staticlib, so the entry points are not visible
        # to a symbol-table search. Their presence is instead confirmed by the
        # linker: `-u _kson_ios_init` (set via `FORCE_LOAD_SYMBOLS` in
        # `project.yml`) fails the link if the archive does not define it.
        run: |
          APP="$RUNNER_TEMP/KsonGame.xcarchive/Products/Applications/USC.app"
          test -f "$APP/USC" || { echo "missing executable"; exit 1; }
          for sym in _kson_ios_init _kson_ios_frame _kson_ios_resize _kson_ios_touch; do
            if ! nm -u "$APP/USC" | grep -q " ${sym}$"; then
              echo "missing ${sym}: the Rust staticlib was not linked in"
              exit 1
            fi
          done
          echo "all Rust entry points are referenced by the app binary"

      - uses: actions/upload-artifact@v4
        with:
          name: USC-ios-unsigned
          path: USC-unsigned.ipa
