[workspace]
members = [
    "kson-effect-param-macro",
    "kson",
    "kson-music-playback",
    "editor",
    "game",
    "game/rusc_database",
    "kson-rodio-sources", "multiplayer-protocol",
    "ios/gilrs-stub",
]
resolver = "2"

# Lua 5.3's `loslib.c` calls `system()`, which iOS marks unavailable, so the
# upstream `lua-src` crate cannot build for `aarch64-apple-ios`. This vendored
# copy defines `LUA_USE_IOS` for the 5.3 tree and stubs `system` out, mirroring
# what Lua 5.4 does upstream.
[patch.crates-io]
lua-src = { path = "ios/lua-src" }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
puffin = "0.19"
puffin_http = "0.16.0"
egui = "0.31"
emath = "0.31"
egui_glow = "0.31"
eframe = { version = "0.31", features = ["persistence"] }
simple_logger = "4.0.0"
image = { version = "0.25", default_features = false, features = [
    "png",
    "jpeg",
] }
serde_json = "1"
rodio = { version = "0", default-features = false, features = [
    "playback",
    "mp3",
    "vorbis",
    "wav",
    "flac",
] }
anyhow = "1"
rand = "0.8.5"
log = "*"
kson_rodio_sources = { path = "../kson-rodio-sources" }
itertools = "0.12.1"
