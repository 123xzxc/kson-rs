[package]
name = "kson-rodio-sources"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rodio = { workspace = true }
rand = { workspace = true }
soundtouch = { git = 'https://github.com/Drewol/soundtouch-rs.git', optional = true }

[profile.dev]
opt = "3"

[features]
default = []
# Pitch shifting uses the vendored SoundTouch C++ library. It is unavailable on
# Android and iOS, where a pass-through implementation is used instead.
pitch-shift = ["dep:soundtouch"]
