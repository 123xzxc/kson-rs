name: KsonGame
options:
  bundleIdPrefix: dev.kson
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # The Rust static library is built by the "Build Rust library" script phase
    # below; Xcode only links the result.
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # The Rust staticlib contains Objective-C categories from objc2/objc crates
    # that must not be dead-stripped.
    OTHER_LDFLAGS: $(inherited) -lc++ -lz -framework AVFoundation -framework CoreAudio -framework CoreMedia -framework AudioToolbox -framework CFNetwork -framework Security -framework SystemConfiguration -framework OpenGLES -framework CoreGraphics -framework QuartzCore -framework Foundation -framework UIKit -framework GameController
    DEAD_CODE_STRIPPING: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"

    # `KsonGameView.m` declares the Rust entry points but only calls a subset of
    # them, so without these the linker would not pull those members out of the
    # static archive. See `ios/README.md`.
    FORCE_LOAD_SYMBOLS: $(inherited) -u _kson_ios_init -u _kson_ios_frame -u _kson_ios_resize -u _kson_ios_touch -u _kson_ios_gamepad_button -u _kson_ios_gamepad_axis -u _kson_ios_set_controllers -u _kson_ios_capture_gamepad_button -u _kson_ios_capture_gamepad_axis -u _kson_ios_axis_binding

targets:
  KsonGame:
    type: application
    platform: iOS
    sources:
      - path: KsonGame/Classes
      - path: KsonGame/Resources
        buildPhase: resources
    info:
      path: KsonGame/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kson.usc
        PRODUCT_NAME: USC
        INFOPLIST_FILE: KsonGame/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        # Built by the script phase and linked from here.
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../target/aarch64-apple-ios/release
        # The archive is also listed explicitly: `-lrusc` alone is silently
        # dropped when the library search path is not yet populated at the time
        # the link flags are expanded. `-u` forces the members to be loaded even
        # though only the Objective-C shim references them.
        OTHER_LDFLAGS: $(inherited) -u _kson_ios_init -u _kson_ios_frame -u _kson_ios_resize -u _kson_ios_touch -u _kson_ios_gamepad_button -u _kson_ios_gamepad_axis -u _kson_ios_set_controllers -u _kson_ios_capture_gamepad_button -u _kson_ios_capture_gamepad_axis -u _kson_ios_axis_binding $(SRCROOT)/../target/aarch64-apple-ios/release/librusc.a
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/KsonGame/Classes
    dependencies: []
    preBuildScripts:
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          export PATH="$HOME/.cargo/bin:$PATH"
          # Keep the Rust C dependencies and the Xcode link step on the same
          # minimum OS version.
          export IPHONEOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET:-15.0}"
          # `--no-default-features` keeps SoundTouch (a desktop-only C++
          # dependency) out of the iOS build.
          #
          # Use `cargo rustc --crate-type staticlib`: the crate also declares
          # `cdylib`, whose standalone link cannot resolve the app-side GL
          # symbols.
          # `-C strip=debuginfo` (instead of the profile's `strip=true`) keeps
          # the symbol table, which `FORCE_LOAD_SYMBOLS` and Xcode's archive
          # inspection rely on.
          cargo rustc --release --target aarch64-apple-ios -p rusc --lib \
            --crate-type staticlib \
            --features embed-assets --no-default-features \
            -- -C strip=debuginfo -C link-dead-code
