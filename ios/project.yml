name: KsonGame
options:
  bundleIdPrefix: dev.kson
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # The Rust static library is built by the "Build Rust library" script phase
    # below; Xcode only links the result.
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # The Rust staticlib contains Objective-C categories from objc2/objc crates
    # that must not be dead-stripped.
    OTHER_LDFLAGS: $(inherited) -lc++ -lz -framework AVFoundation -framework CoreAudio -framework CoreMedia -framework AudioToolbox -framework CFNetwork -framework Security -framework SystemConfiguration -framework OpenGLES -framework CoreGraphics -framework QuartzCore -framework Foundation -framework UIKit
    DEAD_CODE_STRIPPING: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"

targets:
  KsonGame:
    type: application
    platform: iOS
    sources:
      - path: KsonGame/Classes
      - path: KsonGame/Resources
        buildPhase: resources
    info:
      path: KsonGame/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kson.usc
        PRODUCT_NAME: USC
        INFOPLIST_FILE: KsonGame/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        # Built by the script phase and linked from here.
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: $(inherited) -lrusc
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/KsonGame/Classes
    dependencies: []
    preBuildScripts:
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          export PATH="$HOME/.cargo/bin:$PATH"
          # Keep the Rust C dependencies and the Xcode link step on the same
          # minimum OS version.
          export IPHONEOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET:-15.0}"
          # `--no-default-features` keeps SoundTouch (a desktop-only C++
          # dependency) out of the iOS build.
          #
          # Use `cargo rustc --crate-type staticlib`: the crate also declares
          # `cdylib`, whose standalone link cannot resolve the app-side GL
          # symbols.
          cargo rustc --release --target aarch64-apple-ios -p rusc --lib \
            --crate-type staticlib \
            --features embed-assets --no-default-features
